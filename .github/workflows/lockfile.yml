name: Generate and validate npm lockfile

on:
  push:
    branches:
      - update/copilot-procurement-app-2026-10-22
  workflow_dispatch:

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile without running package lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate the generated lockfile with a clean install
        run: npm ci --no-audit --no-fund
      - name: Run prototype source checks
        run: npm run check:prototype
      - name: Run React runtime smoke tests
        run: CI=true npm test -- --watchAll=false
      - name: Build React app
        run: npm run build
      - name: Commit lockfile if it changed
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add validated npm lockfile"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "The committed lockfile is already current."
          fi
