name: Safely refresh vulnerable npm dependencies

on:
  push:
    branches:
      - update/copilot-procurement-app-2026-10-22

concurrency:
  group: dependency-refresh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply non-breaking npm security fixes only
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo "Some advisories may require a reviewed major upgrade; continuing with validation."
      - name: Validate dependency tree with clean install
        run: npm ci --no-audit --no-fund
      - name: Run prototype source checks
        run: npm run check:prototype
      - name: Run React runtime smoke tests
        run: CI=true npm test -- --watchAll=false
      - name: Build React app
        run: npm run build
      - name: Capture updated dependency audit report
        if: always()
        run: timeout 90s npm audit --json --fetch-timeout=15000 --fetch-retries=0 > npm-audit-after.json || true
      - name: Upload updated dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-after-safe-fixes
          path: npm-audit-after.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit lockfile if it changed
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply non-breaking npm security updates"
            git push origin "HEAD:${BRANCH_NAME}"
          else
            echo "No semver-compatible dependency updates were available."
          fi
