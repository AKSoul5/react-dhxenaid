# Builds the Shajarah Windows installer on a real Windows machine, installs
# it silently, starts the installed program in its smoke-test mode (its own
# database, the app server, saving a family) and uploads the installer.
#
# A new version (desktop/electron/package.json) is published as a GitHub
# release, which installed copies update themselves from. Then the previous
# release is installed and updated to the new one, as on a user's laptop;
# if that fails, the new release is withdrawn.
name: Shajarah Windows installer

on:
  workflow_dispatch:
  push:
    branches: [claude/shajarah-family-tree-app-vp01qo]
    paths:
      - "shajarah/**"
      - ".github/workflows/shajarah-windows-installer.yml"

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: shajarah
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shajarah/package-lock.json
            shajarah/desktop/electron/package-lock.json

      - name: Build the app (standalone server)
        env:
          NEXT_OUTPUT: standalone
        run: |
          npm ci
          npm run build

      - name: Build the installer
        working-directory: shajarah/desktop/electron
        run: |
          npm ci
          npm run prepare-app
          npx electron-builder --win nsis --publish never
          Get-ChildItem dist -File | Format-Table Name, Length
          if (-not (Test-Path dist/latest.yml)) { throw "No update information (latest.yml) was built" }

      - name: Install it and run the smoke test (first and second launch)
        working-directory: shajarah/desktop/electron
        run: |
          $setup = Get-ChildItem dist -Filter 'Shajarah-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Shajarah\Shajarah.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $logs = Join-Path $env:APPDATA 'Shajarah\logs'
          foreach ($launch in 'first', 'second') {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The $launch launch did not finish in 5 minutes" }
            $result = Get-Content (Join-Path $logs 'smoke-test.txt')
            "$launch launch: $result (whole run $([int]$clock.Elapsed.TotalSeconds) s)"
            if ($p.ExitCode -ne 0) { Get-Content (Join-Path $logs 'shajarah.log'); throw "Smoke test failed on the $launch launch" }
          }
          Get-Content (Join-Path $logs 'shajarah.log')
          # a normal (not first) launch must be quick
          $seconds = [double](($result | Select-String '"startupSeconds":([0-9.]+)').Matches[0].Groups[1].Value)
          if ($seconds -gt 20) { throw "The second launch took $seconds s to start (limit 20 s)" }

      - name: Publish a new version as a release
        id: publish
        working-directory: shajarah/desktop/electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release view "v$version" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { "v$version is already released"; $global:LASTEXITCODE = 0; exit 0 }
          $previous = gh release view --json tagName --jq .tagName 2>$null
          $global:LASTEXITCODE = 0
          $notes = (git log -1 --format=%B) -join "`n"
          gh release create "v$version" "dist/Shajarah-Setup-$version.exe" "dist/Shajarah-Setup-$version.exe.blockmap" dist/latest.yml `
            --target $env:GITHUB_SHA --title "Shajarah $version" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous=$previous" >> $env:GITHUB_OUTPUT

      - name: Update the previous release to the new one
        if: steps.publish.outputs.previous != ''
        working-directory: shajarah/desktop/electron
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.publish.outputs.version }}
          OLD: ${{ steps.publish.outputs.previous }}
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Shajarah\Shajarah.exe'
          $logs = Join-Path $env:APPDATA 'Shajarah\logs'
          # (the update's installer removes the old program before copying the
          # new one: in between there is no Shajarah.exe)
          $installed = { if (Test-Path $exe) { "$((Get-Item $exe).VersionInfo.ProductVersion)" } else { "" } }
          try {
            gh release download $env:OLD --pattern 'Shajarah-Setup-*.exe' --dir previous
            $old = Get-ChildItem previous -Filter 'Shajarah-Setup-*.exe' | Select-Object -First 1
            Start-Process -FilePath $old.FullName -ArgumentList '/S' -Wait
            "installed: $(& $installed)"
            if (-not (& $installed).StartsWith($env:OLD.TrimStart('v'))) { throw "The previous version did not install" }
            $p = Start-Process -FilePath $exe -ArgumentList '--update-test' -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The update check did not finish in 5 minutes" }
            Get-Content (Join-Path $logs 'update-test.txt')
            if ($p.ExitCode -ne 0) { throw "The update failed" }
            # the downloaded installer runs on its own once the program has quit
            $clock = [Diagnostics.Stopwatch]::StartNew()
            Start-Sleep 5
            while ((Get-Process -Name 'Shajarah-Setup*' -ErrorAction SilentlyContinue) -and $clock.Elapsed.TotalSeconds -lt 300) { Start-Sleep 3 }
            while (-not (& $installed).StartsWith($env:NEW) -and $clock.Elapsed.TotalSeconds -lt 300) { Start-Sleep 5 }
            "installed after the update: $(& $installed) ($([int]$clock.Elapsed.TotalSeconds) s)"
            if (-not (& $installed).StartsWith($env:NEW)) { throw "The update did not install" }
            Start-Sleep 10
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The updated program did not start" }
            Get-Content (Join-Path $logs 'smoke-test.txt')
            if ($p.ExitCode -ne 0) { throw "The updated program failed its smoke test" }
          } catch {
            Get-Content (Join-Path $logs 'shajarah.log') -Tail 60 -ErrorAction SilentlyContinue
            "Withdrawing v${env:NEW}: $_"
            gh release delete "v$env:NEW" --yes --cleanup-tag
            throw
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Shajarah-Windows-installer
          path: shajarah/desktop/electron/dist/Shajarah-Setup-*.exe
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shajarah-logs
          path: ~/AppData/Roaming/Shajarah/logs
          if-no-files-found: ignore
