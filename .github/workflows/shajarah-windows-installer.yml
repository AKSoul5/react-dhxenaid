# Builds the Shajarah Windows installer on a real Windows machine, installs
# it silently, starts the installed program in its smoke-test mode (its own
# database, the app server, saving a family) and uploads the installer.
name: Shajarah Windows installer

on:
  workflow_dispatch:
  push:
    branches: [claude/shajarah-family-tree-app-vp01qo]
    paths:
      - "shajarah/**"
      - ".github/workflows/shajarah-windows-installer.yml"

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: shajarah
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shajarah/package-lock.json
            shajarah/desktop/electron/package-lock.json

      - name: Build the app (standalone server)
        env:
          NEXT_OUTPUT: standalone
        run: |
          npm ci
          npm run build

      - name: Build the installer
        working-directory: shajarah/desktop/electron
        run: |
          npm ci
          npm run prepare-app
          npx electron-builder --win nsis --publish never
          Get-ChildItem dist -Filter *.exe | Format-Table Name, Length

      - name: Install it and run the smoke test (first and second launch)
        working-directory: shajarah/desktop/electron
        run: |
          $setup = Get-ChildItem dist -Filter 'Shajarah-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Shajarah\Shajarah.exe'
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          $logs = Join-Path $env:APPDATA 'Shajarah\logs'
          foreach ($launch in 'first', 'second') {
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The $launch launch did not finish in 5 minutes" }
            $result = Get-Content (Join-Path $logs 'smoke-test.txt')
            "$launch launch: $result (whole run $([int]$clock.Elapsed.TotalSeconds) s)"
            if ($p.ExitCode -ne 0) { Get-Content (Join-Path $logs 'shajarah.log'); throw "Smoke test failed on the $launch launch" }
          }
          Get-Content (Join-Path $logs 'shajarah.log')
          # a normal (not first) launch must be quick
          $seconds = [double](($result | Select-String '"startupSeconds":([0-9.]+)').Matches[0].Groups[1].Value)
          if ($seconds -gt 20) { throw "The second launch took $seconds s to start (limit 20 s)" }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Shajarah-Windows-installer
          path: shajarah/desktop/electron/dist/Shajarah-Setup-*.exe
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shajarah-logs
          path: ~/AppData/Roaming/Shajarah/logs
          if-no-files-found: ignore
