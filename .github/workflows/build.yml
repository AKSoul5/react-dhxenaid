name: Prototype build validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: prototype-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run prototype source checks
        run: npm run check:prototype
      - name: Run React runtime smoke tests
        run: CI=true npm test
      - name: Build React app
        run: npm run build
      - name: Install desktop packaging dependencies
        run: npm --prefix desktop install --no-package-lock --no-audit --no-fund
      - name: Check desktop main process syntax
        run: npm --prefix desktop run check
      - name: Capture dependency audit report
        if: always()
        run: timeout 90s npm audit --json --fetch-timeout=15000 --fetch-retries=0 > npm-audit.json || true
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
