name: Prototype build validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: prototype-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run prototype source checks
        run: npm run check:prototype
      - name: Run React runtime smoke tests
        run: CI=true npm test -- --watchAll=false
      - name: Build React app
        run: npm run build
      - name: Capture dependency audit report
        if: always()
        run: timeout 90s npm audit --json --fetch-timeout=15000 --fetch-retries=0 > npm-audit.json || true
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
