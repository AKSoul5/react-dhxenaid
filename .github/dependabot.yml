version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "vitest"
      development-tooling:
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
